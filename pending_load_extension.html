<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pending load extension · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=3" />
  <script src="/mzo_ui.js?v=1" defer></script>
  <script src="/mzo_data_hub.js" defer></script>
  <script src="/mzo_scope.js?v=5" defer></script>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Pending load extension</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn" id="syncBtn" hidden><svg class="ui-i"><use href="#ui-sync"/></svg>Sync sheet</button>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-filters">
      <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Application, consumer ID or name" autocomplete="off" /></label>
      <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
      <span class="ui-select"><select id="classFilter" aria-label="Class"><option value="">All classes</option></select></span>
      <span class="ui-select"><select id="phaseFilter" aria-label="Phase"><option value="">Any phase</option><option value="I">Single phase</option><option value="III">Three phase</option></select></span>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>

    <section class="ui-stats" style="--n:5" id="stats" aria-label="Summary">
      <button type="button" class="ui-stat" data-k="all"><div class="k">Pending</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="y1"><div class="k">Waiting over a year</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="ind"><div class="k">Industrial</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="ph3"><div class="k">Three phase</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="big"><div class="k">Above 10 kW</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
    </section>

    <div class="ui-grid">
      <section class="ui-panel">
        <div class="ui-panel-h">
          <h2>By office</h2>
          <div class="ui-tabs" role="tablist" id="levelTabs">
            <button type="button" class="ui-tab" role="tab" data-l="region" aria-selected="true">Region</button>
            <button type="button" class="ui-tab" role="tab" data-l="division">Division</button>
            <button type="button" class="ui-tab" role="tab" data-l="ccc">CCC</button>
          </div>
        </div>
        <div id="officeTable"><div class="ui-empty">Loading…</div></div>
      </section>
      <div>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>Waiting time</h2></div>
          <div class="ui-panel-b"><div id="ageHist"></div></div>
        </section>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>By class</h2></div>
          <div class="ui-panel-b"><div id="classHist"></div></div>
        </section>
      </div>
    </div>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2>Applications <small id="appCount"></small></h2>
        <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
      </div>
      <div id="appTable"><div class="ui-empty">Loading…</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var CLASS = { D: 'Domestic', C: 'Commercial', I: 'Industrial', A: 'Agriculture', P: 'Public', GS: 'Govt. supply', W: 'Water works', X: 'Other' };
    var AGE = [
      { key: 'a0', label: 'Under 3 months', max: 2 },
      { key: 'a1', label: '3–6 months', max: 5 },
      { key: 'a2', label: '6–12 months', max: 11 },
      { key: 'a3', label: '1–2 years', max: 23 },
      { key: 'a4', label: '2–5 years', max: 59 },
      { key: 'a5', label: 'Over 5 years', max: Infinity }
    ];
    var all = [], f = { q: '', region: '', division: '', ccc: '', cls: '', phase: '', stat: '', age: '' }, level = 'region', scope = null;

    // Fixed-charge revenue held up by the delay (same formula the team has used).
    function loss(r) {
      if (r.applied <= r.curr) return 0;
      var rate = r.cls === 'I' ? 75 : (r.cls === 'C' || r.cls === 'A') ? 60 : 30;
      return Math.round(((r.applied - r.curr) * rate * r.age) / 850);
    }

    function prepare(text) {
      var rows = UI.csv(text), asOn = '';
      all = rows.filter(function (d) { return d.APPL_NO || d.CON_ID; }).map(function (d) {
        if (!asOn && d.report_date) asOn = d.report_date;
        var o = UI.office(d['CCC CODE']);
        var r = {
          appl: (d.APPL_NO || '').trim(), con: (d.CON_ID || '').trim(), name: UI.blank(d.NAME) ? '' : UI.title(d.NAME),
          address: d.ADDRESS, code: String(d['CCC CODE'] || '').trim(),
          _region: o.region, _divn: o.division, _supp: o.ccc, CCC_CODE: String(d['CCC CODE'] || '').trim(),
          cls: String(d.CONN_CLASS || '').trim().toUpperCase(), phase: String(d.CONN_PHASE || '').trim().toUpperCase(),
          applied: parseFloat(d.LOAD_APPLIED) || 0, curr: parseFloat(d.CURR_LOAD) || 0,
          age: parseInt(d.AGE_MONTHS, 10) || 0, collected: d.COLLECTION_DATE,
          wo: UI.blank(d.WON_ASSIGNED) ? '' : d.WON_ASSIGNED, assignee: UI.blank(d.WO_ASSIGNEE) ? '' : UI.title(d.WO_ASSIGNEE),
          category: d.CONN_CATEGORY === 'U' ? 'Urban' : d.CONN_CATEGORY === 'R' ? 'Rural' : ''
        };
        r.loss = loss(r);
        r.ageKey = AGE.filter(function (b) { return r.age <= b.max; })[0].key;
        return r;
      });
      if (window.MzoScope) all = window.MzoScope.filterRows(all);
      $('meta').textContent = (asOn ? 'As on ' + UI.fmtDate(asOn) + ' · ' : '') + UI.n(all.length) + ' applications';
      fillFilters();
    }

    function uniq(rows, k) { var s = {}; rows.forEach(function (r) { if (r[k]) s[r[k]] = 1; }); return Object.keys(s).sort(); }
    function fillFilters() {
      UI.fill('regionFilter', uniq(all, '_region'), 'All regions');
      var r1 = all.filter(function (r) { return !f.region || r._region === f.region; });
      UI.fill('divisionFilter', uniq(r1, '_divn'), 'All divisions');
      var r2 = r1.filter(function (r) { return !f.division || r._divn === f.division; });
      UI.fill('cccFilter', uniq(r2, '_supp'), 'All CCCs');
      UI.fill('classFilter', uniq(all, 'cls').map(function (c) { return { value: c, label: CLASS[c] || c }; }), 'All classes');
      if (!scope) scope = UI.lockScope();
      readFilters();
    }
    function readFilters() {
      f.region = $('regionFilter').value; f.division = $('divisionFilter').value; f.ccc = $('cccFilter').value;
      f.cls = $('classFilter').value; f.phase = $('phaseFilter').value;
    }

    var STAT = {
      all: function () { return true; },
      y1: function (r) { return r.age >= 12; },
      ind: function (r) { return r.cls === 'I'; },
      ph3: function (r) { return r.phase === 'III'; },
      big: function (r) { return r.applied > 10000; }
    };

    // Rows matching office/class/phase/search (the base the numbers are counted on).
    function base() {
      var q = f.q.toLowerCase();
      return all.filter(function (r) {
        return (!f.region || r._region === f.region) && (!f.division || r._divn === f.division) && (!f.ccc || r._supp === f.ccc) &&
          (!f.cls || r.cls === f.cls) && (!f.phase || r.phase === f.phase) &&
          (!q || r.appl.indexOf(q) !== -1 || r.con.indexOf(q) !== -1 || r.name.toLowerCase().indexOf(q) !== -1);
      });
    }

    function render() {
      var b = base();
      var view = b.filter(function (r) { return (!f.stat || STAT[f.stat](r)) && (!f.age || r.ageKey === f.age); });
      var sum = function (rows) { return rows.reduce(function (a, r) { return a + r.loss; }, 0); };

      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k'), rows = b.filter(STAT[k]);
        el.querySelector('.v').textContent = UI.n(rows.length);
        el.querySelector('.s').textContent = (k === 'all' ? 'Est. loss ' : UI.pct(rows.length, b.length) + ' · ') + UI.inr(sum(rows));
        el.setAttribute('aria-pressed', String(f.stat === k || (k === 'all' && !f.stat)));
      });

      // Offices
      var key = level === 'region' ? '_region' : level === 'division' ? '_divn' : '_supp', groups = {};
      view.forEach(function (r) {
        var g = groups[r[key] || 'Unmapped'] || (groups[r[key] || 'Unmapped'] = { name: r[key] || 'Unmapped', parent: level === 'ccc' ? r._divn : level === 'division' ? r._region : '', n: 0, y1: 0, loss: 0 });
        g.n++; if (r.age >= 12) g.y1++; g.loss += r.loss;
      });
      var list = Object.keys(groups).map(function (k) { return groups[k]; }), max = Math.max.apply(null, list.map(function (g) { return g.n; }).concat([0]));
      UI.table('officeTable', {
        rows: list, sort: { key: 'n', dir: 'desc' }, count: false,
        empty: 'No pending applications for these filters.',
        columns: [
          { key: 'name', label: level === 'ccc' ? 'CCC' : level === 'division' ? 'Division' : 'Region', fmt: function (v, g) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (g.parent ? '<span class="sub">' + UI.esc(g.parent) + '</span>' : ''); } },
          { key: 'n', label: 'Pending', num: true, fmt: UI.n },
          { key: 'y1', label: 'Over a year', num: true, fmt: UI.n },
          { key: 'loss', label: 'Est. loss', num: true, fmt: UI.inr, hideSm: true },
          { key: 'share', label: 'Share', sortVal: function (g) { return g.n; }, fmt: function (_, g) { return UI.bar(g.n, max, UI.pct(g.n, view.length)); }, hideSm: true, width: '28%' }
        ],
        foot: list.length > 1 ? { n: view.length, y1: view.filter(STAT.y1).length, loss: sum(view) } : null,
        onRow: level === 'ccc' ? null : function (g) { drill(g.name); }
      });

      // Distributions
      UI.hist('ageHist', AGE.map(function (bk) { return { key: bk.key, label: bk.label, value: b.filter(function (r) { return r.ageKey === bk.key && (!f.stat || STAT[f.stat](r)); }).length }; }),
        { active: f.age, onClick: function (row) { f.age = f.age === row.key ? '' : row.key; render(); } });
      var cls = {};
      b.filter(function (r) { return (!f.stat || STAT[f.stat](r)) && (!f.age || r.ageKey === f.age); }).forEach(function (r) { cls[r.cls] = (cls[r.cls] || 0) + 1; });
      UI.hist('classHist', Object.keys(cls).sort(function (a, c) { return cls[c] - cls[a]; }).slice(0, 6).map(function (c) { return { key: c, label: CLASS[c] || c, value: cls[c] }; }),
        { active: f.cls, onClick: function (row) { $('classFilter').value = f.cls === row.key ? '' : row.key; UI.mark($('classFilter')); readFilters(); render(); } });

      // Applications
      $('appCount').textContent = UI.n(view.length);
      UI.table('appTable', {
        rows: view, sort: { key: 'age', dir: 'desc' }, limit: 50, resetPage: true,
        empty: 'No applications match these filters.',
        columns: APP_COLS,
        onRow: function (r) { detail(r); }
      });
      $('clearBtn').hidden = !(f.q || f.cls || f.phase || f.stat || f.age || (!$('regionFilter').disabled && f.region) || (!$('divisionFilter').disabled && f.division) || (!$('cccFilter').disabled && f.ccc));
      window.__view = view;
    }

    var APP_COLS = [
      { key: 'appl', label: 'Application', fmt: function (v, r) { return '<span class="ui-strong">' + UI.esc(v || '—') + '</span><span class="sub">' + UI.esc(r.con) + '</span>'; } },
      { key: 'name', label: 'Name', hideSm: true, cls: 'wrap' },
      { key: '_supp', label: 'CCC', fmt: function (v, r) { return UI.esc(v || r.code) + '<span class="sub">' + UI.esc(r._divn) + '</span>'; } },
      { key: 'cls', label: 'Class', fmt: function (v, r) { return UI.esc(CLASS[v] || v) + '<span class="sub">' + (r.phase === 'III' ? 'Three phase' : 'Single phase') + '</span>'; }, hideSm: true },
      { key: 'applied', label: 'Load now → applied', num: true, fmt: function (v, r) { return UI.n(r.curr) + ' → <span class="ui-strong">' + UI.n(v) + '</span>'; }, csv: function (r) { return r.curr + ' -> ' + r.applied; } },
      { key: 'age', label: 'Waiting', num: true, fmt: function (v) { return UI.age(v * 30.4); }, csv: function (r) { return r.age + ' months'; } },
      { key: 'loss', label: 'Est. loss', num: true, fmt: UI.inr, hideSm: true },
      { key: 'assignee', label: 'Work order', hideSm: true, fmt: function (v, r) { return v ? UI.esc(v) : '<span class="ui-muted">Not issued</span>'; } }
    ];

    function detail(r) {
      UI.drawer('Application ' + (r.appl || '—'), [r._supp, r._divn].filter(Boolean).join(' · '), [
        ['Consumer ID', r.con], ['Name', r.name], ['Address', r.address], ['Class', (CLASS[r.cls] || r.cls) + (r.category ? ' · ' + r.category : '')],
        ['Phase', r.phase === 'III' ? 'Three phase' : 'Single phase'], ['Current load', UI.n(r.curr)], ['Applied load', UI.n(r.applied)],
        ['Collected on', UI.fmtDate(r.collected)], ['Waiting', UI.age(r.age * 30.4)], ['Est. fixed-charge loss', UI.inr(r.loss)],
        ['Work order', r.wo], ['Assigned to', r.assignee || 'Not issued'], ['CCC code', r.code]
      ]);
    }

    function drill(name) {
      if (level === 'region') { $('regionFilter').value = name; level = 'division'; }
      else if (level === 'division') { $('divisionFilter').value = name; level = 'ccc'; }
      onOffice();
      setLevel(level);
    }
    function setLevel(l) {
      level = l;
      [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === l)); });
      render();
    }
    function onOffice() {
      readFilters(); fillFilters();
      ['regionFilter', 'divisionFilter', 'cccFilter', 'classFilter', 'phaseFilter'].forEach(function (id) { UI.mark($(id)); });
    }

    /* events */
    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { $(id).addEventListener('change', function () { if (id === 'regionFilter') $('divisionFilter').value = ''; if (id !== 'cccFilter') $('cccFilter').value = ''; onOffice(); render(); }); });
    ['classFilter', 'phaseFilter'].forEach(function (id) { $(id).addEventListener('change', function () { UI.mark(this); readFilters(); render(); }); });
    $('q').addEventListener('input', UI.debounce(function () { f.q = this.value.trim(); render(); }, 160));
    $('stats').addEventListener('click', function (e) { var s = e.target.closest('.ui-stat'); if (!s) return; var k = s.getAttribute('data-k'); f.stat = (k === 'all' || f.stat === k) ? '' : k; render(); });
    $('levelTabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) setLevel(t.getAttribute('data-l')); });
    $('clearBtn').addEventListener('click', function () {
      f.q = ''; f.stat = ''; f.age = ''; $('q').value = '';
      ['regionFilter', 'divisionFilter', 'cccFilter', 'classFilter', 'phaseFilter'].forEach(function (id) { if (!$(id).disabled) $(id).value = ''; });
      onOffice(); setLevel(scope && scope.level === 'ccc' ? 'ccc' : scope && scope.level === 'division' ? 'ccc' : 'region');
    });
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('pending-load-extension.csv', [{ key: 'appl', label: 'Application' }, { key: 'con', label: 'Consumer ID' }, { key: 'name', label: 'Name' }, { key: '_region', label: 'Region' }, { key: '_divn', label: 'Division' }, { key: '_supp', label: 'CCC' }]
        .concat(APP_COLS.slice(3).map(function (c) { return { key: c.key, label: c.label, csv: c.csv }; })), window.__view || []);
    });
    $('refreshBtn').addEventListener('click', function () {
      var b = this; b.classList.add('spin');
      Promise.resolve(window.mzoDataHub && window.mzoDataHub.waitForDataset('CACHE_LOAD_EXT', { forceCheck: true })).catch(function () {})
        .then(function () { return window.mzoDataHub._peek('CACHE_LOAD_EXT'); }).then(function (t) { if (t) { prepare(t); render(); } })
        .then(function () { b.classList.remove('spin'); });
    });

    // Sync from the Google Sheet (authorised users only)
    fetch('/api/load-extension/meta', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (m) { if (m && (m.canSync || m.isAdmin)) $('syncBtn').hidden = false; }).catch(function () {});
    $('syncBtn').addEventListener('click', function () {
      if (!confirm('Pull the latest pending load extensions from the Google Sheet now?')) return;
      var b = this; b.disabled = true; b.classList.add('spin');
      fetch('/api/load-extension/sync', { method: 'POST', credentials: 'same-origin', headers: { Accept: 'application/json' } })
        .then(function (r) { return r.json().catch(function () { return { status: 'error', message: 'HTTP ' + r.status }; }); })
        .then(function (d) {
          if (d.status !== 'success') throw new Error(d.message || 'Sync failed');
          try { localStorage.removeItem('mzo_hub_ver_CACHE_LOAD_EXT'); } catch (e) {}
          return window.mzoDataHub.refresh('CACHE_LOAD_EXT').then(function () { return window.mzoDataHub._peek('CACHE_LOAD_EXT'); });
        })
        .then(function (t) { if (t) { prepare(t); render(); } UI.toast('Synced from the sheet'); })
        .catch(function (e) { UI.toast(e.message || 'Sync failed'); })
        .then(function () { b.disabled = false; b.classList.remove('spin'); });
    });

    // Deep links: ?division=…, ?kpi=kpiAgeing1y
    var params = new URLSearchParams(location.search);
    var first = true;
    UI.load('CACHE_LOAD_EXT', function (text, info) {
      if (!text) { if (info && info.error) { $('meta').textContent = 'Could not load data'; $('appTable').innerHTML = $('officeTable').innerHTML = '<div class="ui-empty">Could not load data.</div>'; } return; }
      prepare(text);
      if (first) {
        first = false;
        var pick = function (id, v) {
          var el = $(id); if (!v || el.disabled) return false;
          var m = [].filter.call(el.options, function (o) { return o.value && o.value.toLowerCase() === v.toLowerCase(); })[0];
          if (m) { el.value = m.value; onOffice(); return true; } return false;
        };
        if (pick('regionFilter', params.get('region'))) level = 'division';
        if (pick('divisionFilter', params.get('division'))) level = 'ccc';
        if (pick('cccFilter', params.get('ccc'))) level = 'ccc';
        if (params.get('q')) { f.q = params.get('q').trim(); $('q').value = f.q; }
        var k = String(params.get('kpi') || '');
        if (/^y1$|1y|year/i.test(k)) f.stat = 'y1'; else if (/ind/i.test(k)) f.stat = 'ind'; else if (/ph3|three/i.test(k)) f.stat = 'ph3'; else if (/big|10/i.test(k)) f.stat = 'big';
        if (scope && (scope.level === 'division' || scope.level === 'ccc')) level = 'ccc';
        else if (scope && scope.level === 'region') level = 'division';
        [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === level)); });
      }
      render();
    });
  });
  </script>
</body>
</html>
