<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pending master card · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=3" />
  <script src="/mzo_ui.js?v=1" defer></script>
  <script src="/mzo_data_hub.js" defer></script>
  <script src="/mzo_scope.js?v=5" defer></script>
  <style>
    .mc-copy { margin-left: auto; }
    #ui-drawer header .mc-copy + [data-x] { margin-left: 4px; }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Pending master card</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn" id="syncBtn" hidden><svg class="ui-i"><use href="#ui-sync"/></svg>Sync sheet</button>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-filters">
      <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Application, consumer ID or name" autocomplete="off" /></label>
      <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
      <span class="ui-select"><select id="classFilter" aria-label="Class"><option value="">All classes</option></select></span>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>

    <section class="ui-stats" style="--n:4" id="stats" aria-label="Summary">
      <button type="button" class="ui-stat" data-k=""><div class="k">Pending</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="WithinMonth"><div class="k">Within 30 days</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="Delayed"><div class="k"><span class="ui-dot bad"></span>90 days or more</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="Industrial"><div class="k">Industrial</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
    </section>

    <div class="ui-grid">
      <section class="ui-panel">
        <div class="ui-panel-h">
          <h2>Breakdown</h2>
          <div class="ui-tabs" role="tablist" id="levelTabs">
            <button type="button" class="ui-tab" role="tab" data-l="region" aria-selected="true">Region</button>
            <button type="button" class="ui-tab" role="tab" data-l="division">Division</button>
            <button type="button" class="ui-tab" role="tab" data-l="ccc">CCC</button>
            <button type="button" class="ui-tab" role="tab" data-l="agency">Agency</button>
          </div>
        </div>
        <div id="officeTable" style="--max-h:520px"><div class="ui-empty">Loading…</div></div>
      </section>
      <div>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>Days since meter installed</h2></div>
          <div class="ui-panel-b"><div id="ageHist"></div></div>
        </section>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>By class</h2></div>
          <div class="ui-panel-b"><div id="classHist"></div></div>
        </section>
      </div>
    </div>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2>Applications <small id="appCount"></small></h2>
        <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
      </div>
      <div id="appTable"><div class="ui-empty">Loading…</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var KEY = 'CACHE_PENDING_MC';
    var CLASS = { D: 'Domestic', C: 'Commercial', I: 'Industrial', A: 'Agriculture', T: 'Temporary', J: 'Public', P: 'Public', W: 'Water works' };
    var AGE = [
      { key: 'a0', label: 'Up to 7 days', max: 7 },
      { key: 'a1', label: '8–30 days', max: 30 },
      { key: 'a2', label: '31–60 days', max: 60 },
      { key: 'a3', label: '61–89 days', max: 89 },
      { key: 'a4', label: '90 days or more', max: Infinity }
    ];
    var STAT = {
      WithinMonth: function (r) { return r.days != null && r.days <= 30; },
      Delayed: function (r) { return r.days != null && r.days >= 90; },
      Industrial: function (r) { return r.cls === 'I'; }
    };
    var all = [], f = { q: '', stat: '', age: '' }, level = 'region', scope = null;

    function ccc(raw, division) {
      var s = String(raw == null ? '' : raw).trim(), S = window.MzoScope;
      if (!s || !S) return s;
      return (S.cccNameInDivision && S.cccNameInDivision(s, division)) || (S.cccNameOf && S.cccNameOf(s)) || s;
    }

    function prepare(text) {
      var latest = null;
      var rows = Array.isArray(text) ? text : UI.csv(text);
      all = rows.filter(function (d) { return d && (d.Region || d.APPL_NO); }).map(function (d) {
        var S = window.MzoScope;
        var division = (S && S.divisionNameOf && S.divisionNameOf(d.Division)) || UI.title(d.Division);
        var rep = UI.date(d['Report Date']), inst = UI.date(d['Meter Installation Date']);
        if (rep && (!latest || rep > latest)) latest = rep;
        var code = String(d['SUBSTR(A.SUPP_OFF,-7,7)'] || '').trim();
        var r = {
          appl: String(d.APPL_NO || '').trim(), con: String(d.CON_ID || '').trim(),
          name: [d.FNAME, d.LNAME].filter(function (x) { return !UI.blank(x); }).map(UI.title).join(' '),
          address: [d.ADDR1, d.ADDR2].filter(function (x) { return !UI.blank(x); }).join(', '),
          _region: UI.regionName(d.Region), _divn: division, _supp: ccc(d.CCC, division), CCC_CODE: code,
          cls: String(d.CLASS || '').trim().toUpperCase(), desc: UI.blank(d.DESC) ? '' : UI.title(d.DESC),
          phase: String(d.PHASE || '').trim().toUpperCase(), load: parseFloat(d.LOAD) || 0,
          tariff: UI.blank(d.TARIFF_CLASS) ? '' : d.TARIFF_CLASS, type: UI.blank(d.PROB_TYPE) ? '' : d.PROB_TYPE,
          agency: UI.blank(d.WO_ASSIGNEE_TYPE) ? 'Individual' : UI.title(d.WO_ASSIGNEE_TYPE),
          wo: UI.blank(d.WO_NO) ? '' : d.WO_NO, woStatus: d.WO_STATUS === 'C' ? 'Completed' : '',
          collected: d.COLL_DATE, installed: inst, report: rep, docs: UI.blank(d.DOCS_SUNMITTED) ? '' : d.DOCS_SUNMITTED,
          area: d.CATG === 'U' ? 'Urban' : d.CATG === 'R' ? 'Rural' : ''
        };
        r.days = rep && inst ? Math.round((rep - inst) / 864e5) : null;
        r.ageKey = r.days == null ? '' : AGE.filter(function (b) { return r.days <= b.max; })[0].key;
        r.label = CLASS[r.cls] || r.desc || r.cls || '—';
        return r;
      });
      if (window.MzoScope) all = window.MzoScope.filterRows(all);
      $('meta').textContent = (latest ? 'As on ' + UI.fmtDate(latest) + ' · ' : '') + UI.n(all.length) + ' meters installed, master card pending';
      fillFilters();
    }

    function uniq(rows, k) { var s = {}; rows.forEach(function (r) { if (r[k]) s[r[k]] = 1; }); return Object.keys(s).sort(); }
    function fillFilters() {
      var reg = $('regionFilter').value, div = $('divisionFilter').value;
      UI.fill('regionFilter', uniq(all, '_region'), 'All regions');
      var r1 = all.filter(function (r) { return !reg || r._region === reg; });
      UI.fill('divisionFilter', uniq(r1, '_divn'), 'All divisions');
      var r2 = r1.filter(function (r) { return !div || r._divn === div; });
      UI.fill('cccFilter', uniq(r2, '_supp'), 'All CCCs');
      var cls = {}; all.forEach(function (r) { if (r.cls) cls[r.cls] = r.label; });
      UI.fill('classFilter', Object.keys(cls).sort().map(function (c) { return { value: c, label: cls[c] }; }), 'All classes');
      if (!scope) scope = UI.lockScope();
    }

    function base() {
      var q = f.q.toLowerCase(), reg = $('regionFilter').value, div = $('divisionFilter').value, cc = $('cccFilter').value, cl = $('classFilter').value;
      return all.filter(function (r) {
        return (!reg || r._region === reg) && (!div || r._divn === div) && (!cc || r._supp === cc) && (!cl || r.cls === cl) &&
          (!q || r.appl.indexOf(q) !== -1 || r.con.indexOf(q) !== -1 || r.name.toLowerCase().indexOf(q) !== -1);
      });
    }

    function render() {
      var b = base();
      var view = b.filter(function (r) { return (!f.stat || STAT[f.stat](r)) && (!f.age || r.ageKey === f.age); });

      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k'), c = k ? b.filter(STAT[k]).length : b.length;
        el.querySelector('.v').textContent = UI.n(c);
        el.querySelector('.s').textContent = k ? UI.pct(c, b.length) + ' of pending' : 'Across ' + uniq(b, '_supp').length + ' CCCs';
        el.setAttribute('aria-pressed', String(f.stat === k));
      });

      var key = { region: '_region', division: '_divn', ccc: '_supp', agency: 'agency' }[level], groups = {};
      view.forEach(function (r) {
        var name = r[key] || 'Unmapped';
        var g = groups[name] || (groups[name] = { name: name, parent: level === 'ccc' ? r._divn : level === 'division' ? r._region : '', n: 0, late: 0 });
        g.n++; if (STAT.Delayed(r)) g.late++;
      });
      var list = Object.keys(groups).map(function (k) { return groups[k]; }), max = Math.max.apply(null, list.map(function (g) { return g.n; }).concat([0]));
      var label = { region: 'Region', division: 'Division', ccc: 'CCC', agency: 'Agency' }[level];
      UI.table('officeTable', {
        rows: list, sort: { key: 'n', dir: 'desc' }, count: level === 'agency',
        empty: 'Nothing pending for these filters.',
        columns: [
          { key: 'name', label: label, cls: level === 'agency' ? 'wrap' : '', fmt: function (v, g) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (g.parent ? '<span class="sub">' + UI.esc(g.parent) + '</span>' : ''); } },
          { key: 'n', label: 'Pending', num: true, fmt: UI.n },
          { key: 'late', label: '90+ days', num: true, fmt: UI.n },
          { key: 'share', label: 'Share', sortVal: function (g) { return g.n; }, fmt: function (_, g) { return UI.bar(g.n, max, UI.pct(g.n, view.length)); }, hideSm: true, width: '30%' }
        ],
        foot: list.length > 1 ? { n: view.length, late: view.filter(STAT.Delayed).length } : null,
        onRow: level === 'region' || level === 'division' ? function (g) { drill(g.name); } : level === 'agency' ? function (g) { f.q = ''; $('q').value = ''; showAgency(g.name); } : null
      });

      var forAge = b.filter(function (r) { return !f.stat || STAT[f.stat](r); });
      UI.hist('ageHist', AGE.map(function (a) { return { key: a.key, label: a.label, value: forAge.filter(function (r) { return r.ageKey === a.key; }).length }; }),
        { active: f.age, onClick: function (row) { f.age = f.age === row.key ? '' : row.key; render(); } });
      var cls = {}; view.forEach(function (r) { cls[r.cls] = cls[r.cls] || { n: 0, label: r.label }; cls[r.cls].n++; });
      UI.hist('classHist', Object.keys(cls).sort(function (x, y) { return cls[y].n - cls[x].n; }).slice(0, 6).map(function (c) { return { key: c, label: cls[c].label, value: cls[c].n }; }),
        { active: $('classFilter').value, onClick: function (row) { var s = $('classFilter'); s.value = s.value === row.key ? '' : row.key; UI.mark(s); render(); } });

      var shown = agencyOnly ? view.filter(function (r) { return r.agency === agencyOnly; }) : view;
      $('appCount').textContent = UI.n(shown.length) + (agencyOnly ? ' · ' + agencyOnly : '');
      UI.table('appTable', { rows: shown, sort: { key: 'days', dir: 'desc' }, limit: 50, resetPage: true, empty: 'No applications match these filters.', columns: APP_COLS, onRow: detail });
      $('clearBtn').hidden = !(f.q || f.stat || f.age || agencyOnly || $('classFilter').value || ['regionFilter', 'divisionFilter', 'cccFilter'].some(function (id) { return $(id).value && !$(id).disabled; }));
      window.__view = shown;
    }

    var agencyOnly = '';
    function showAgency(name) { agencyOnly = agencyOnly === name ? '' : name; render(); $('appTable').scrollIntoView({ behavior: 'smooth', block: 'start' }); }

    var APP_COLS = [
      { key: 'appl', label: 'Application', fmt: function (v, r) { return '<span class="ui-strong">' + UI.esc(v || '—') + '</span><span class="sub">' + UI.esc(r.con) + '</span>'; } },
      { key: 'name', label: 'Name', hideSm: true, cls: 'wrap' },
      { key: '_supp', label: 'CCC', fmt: function (v, r) { return UI.esc(v || '—') + '<span class="sub">' + UI.esc(r._divn) + '</span>'; } },
      { key: 'label', label: 'Class', hideSm: true, fmt: function (v, r) { return UI.esc(v) + '<span class="sub">' + (r.phase === 'III' ? 'Three phase' : r.phase === 'I' ? 'Single phase' : '') + '</span>'; } },
      { key: 'load', label: 'Load', num: true, hideSm: true, fmt: function (v) { return v ? UI.n(v) : '—'; } },
      { key: 'agency', label: 'Agency', hideSm: true, cls: 'wrap' },
      { key: 'installed', label: 'Meter installed', num: true, hideSm: true, sortVal: function (r) { return r.installed ? r.installed.getTime() : 0; }, fmt: function (v) { return UI.fmtDate(v); }, csv: function (r) { return UI.fmtDate(r.installed); } },
      { key: 'days', label: 'Days', num: true, sortVal: function (r) { return r.days == null ? -1 : r.days; }, fmt: function (v) { return v == null ? '—' : (v >= 90 ? '<span class="ui-badge bad">' + UI.n(v) + '</span>' : UI.n(v)); }, csv: function (r) { return r.days == null ? '' : r.days; } }
    ];

    var current = null;
    function pairs(r) {
      return [
        ['Consumer ID', r.con], ['Name', r.name], ['Address', r.address], ['Class', r.label + (r.area ? ' · ' + r.area : '')],
        ['Phase', r.phase === 'III' ? 'Three phase' : r.phase === 'I' ? 'Single phase' : ''], ['Load', r.load ? UI.n(r.load) : ''], ['Tariff', r.tariff],
        ['Connection type', r.type], ['Collected on', UI.blank(r.collected) ? '' : UI.fmtDate(r.collected)], ['Meter installed', UI.fmtDate(r.installed)],
        ['Days pending', r.days == null ? '' : UI.n(r.days)], ['Agency', r.agency], ['Work order', r.wo + (r.woStatus ? ' · ' + r.woStatus : '')],
        ['Region', r._region], ['Division', r._divn], ['CCC', r._supp], ['Report date', UI.fmtDate(r.report)]
      ];
    }
    function detail(r) {
      current = r;
      UI.drawer('Application ' + (r.appl || '—'), [r._supp, r._divn].filter(Boolean).join(' · '), pairs(r));
      var head = document.querySelector('#ui-drawer header');
      if (head && !head.querySelector('.mc-copy')) {
        head.querySelector('[data-x]').insertAdjacentHTML('beforebegin', '<button type="button" class="ui-btn sm mc-copy"><svg class="ui-i"><use href="#ui-copy"/></svg>Copy</button>');
        head.querySelector('.mc-copy').addEventListener('click', function () {
          if (!current) return;
          var lines = ['*Pending master card — ' + current.appl + '*'].concat(pairs(current).filter(function (p) { return !UI.blank(p[1]); }).map(function (p) { return p[0] + ': ' + p[1]; }));
          UI.copy(lines.join('\n')).then(function () { UI.toast('Details copied'); });
        });
      }
    }

    function setLevel(l) {
      level = l;
      [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === l)); });
      render();
    }
    function drill(name) {
      if (level === 'region') { $('regionFilter').value = name; $('divisionFilter').value = ''; level = 'division'; }
      else { $('divisionFilter').value = name; level = 'ccc'; }
      $('cccFilter').value = '';
      offices();
      setLevel(level);
    }
    function offices() { fillFilters(); ['regionFilter', 'divisionFilter', 'cccFilter', 'classFilter'].forEach(function (x) { UI.mark($(x)); }); }

    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') $('divisionFilter').value = '';
        if (id !== 'cccFilter') $('cccFilter').value = '';
        offices(); render();
      });
    });
    $('classFilter').addEventListener('change', function () { UI.mark(this); render(); });
    $('q').addEventListener('input', UI.debounce(function () { f.q = this.value.trim(); render(); }, 160));
    $('stats').addEventListener('click', function (e) { var s = e.target.closest('.ui-stat'); if (!s) return; var k = s.getAttribute('data-k'); f.stat = f.stat === k ? '' : k; render(); });
    $('levelTabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) setLevel(t.getAttribute('data-l')); });
    $('clearBtn').addEventListener('click', function () {
      f.q = ''; f.stat = ''; f.age = ''; agencyOnly = ''; $('q').value = ''; $('classFilter').value = '';
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { if (!$(id).disabled) $(id).value = ''; });
      offices(); render();
    });
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('pending-master-card.csv', [
        { key: 'appl', label: 'Application' }, { key: 'con', label: 'Consumer ID' }, { key: 'name', label: 'Name' },
        { key: '_region', label: 'Region' }, { key: '_divn', label: 'Division' }, { key: '_supp', label: 'CCC' },
        { key: 'label', label: 'Class' }, { key: 'phase', label: 'Phase' }, { key: 'load', label: 'Load' }, { key: 'agency', label: 'Agency' },
        { key: 'wo', label: 'Work order' }].concat(APP_COLS.slice(6)), window.__view || []);
    });

    function reload(text) { if (text) { prepare(text); render(); } }
    $('refreshBtn').addEventListener('click', function () {
      var b = this; b.classList.add('spin');
      Promise.resolve(window.mzoDataHub.waitForDataset(KEY, { forceCheck: true })).catch(function () {})
        .then(function () { return window.mzoDataHub._peek(KEY); }).then(reload)
        .then(function () { b.classList.remove('spin'); });
    });

    // Sync from the Google Sheet (authorised users only)
    fetch('/api/pending-mc/meta', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (m) { if (m && (m.canSync || m.isAdmin)) $('syncBtn').hidden = false; }).catch(function () {});
    $('syncBtn').addEventListener('click', function () {
      if (!confirm('Pull the latest pending master cards from the Google Sheet now?')) return;
      var b = this; b.disabled = true; b.classList.add('spin');
      fetch('/api/pending-mc/sync', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', Accept: 'application/json' } })
        .then(function (r) { return r.json().catch(function () { return { status: 'error', message: r.status === 401 ? 'Session expired. Sign in again.' : 'HTTP ' + r.status }; }); })
        .then(function (d) {
          if (d.status !== 'success') throw new Error(d.message || 'Sync failed');
          try { localStorage.removeItem('mzo_hub_ver_' + KEY); localStorage.removeItem('mzo_hub_ver_CACHE_PENDING_MC_PARSED'); } catch (e) {}
          return Promise.resolve(window.mzoDataHub.delete('CACHE_PENDING_MC_PARSED')).catch(function () {})
            .then(function () { return window.mzoDataHub.refresh(KEY); })
            .then(function () { return window.mzoDataHub._peek(KEY); });
        })
        .then(function (t) { reload(t); UI.toast('Synced from the sheet'); })
        .catch(function (e) { UI.toast(e.message || 'Sync failed'); })
        .then(function () { b.disabled = false; b.classList.remove('spin'); });
    });

    // Deep links: ?kpiFilter=Delayed|Industrial|WithinMonth, ?region=, ?division=, ?ccc=
    var params = new URLSearchParams(location.search), first = true;
    UI.load(KEY, function (text, info) {
      if (!text) { if (info && info.error) { $('meta').textContent = 'Could not load data'; $('appTable').innerHTML = $('officeTable').innerHTML = '<div class="ui-empty">Could not load data.</div>'; } return; }
      prepare(text);
      if (first) {
        first = false;
        var k = params.get('kpiFilter'); if (STAT[k]) f.stat = k;
        var pick = function (id, val) {
          var el = $(id); if (!val || el.disabled) return false;
          var m = [].filter.call(el.options, function (o) { return o.value.toLowerCase() === val.toLowerCase(); })[0];
          if (m) { el.value = m.value; offices(); return true; } return false;
        };
        if (pick('regionFilter', UI.regionName(params.get('region') || ''))) level = 'division';
        if (pick('divisionFilter', params.get('division'))) level = 'ccc';
        if (pick('cccFilter', params.get('ccc'))) level = 'ccc';
        if (scope && (scope.level === 'division' || scope.level === 'ccc')) level = 'ccc';
        else if (scope && scope.level === 'region' && level === 'region') level = 'division';
        [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === level)); });
      }
      render();
    });
  });
  </script>
</body>
</html>
