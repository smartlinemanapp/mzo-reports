<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solar connections · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=3" />
  <script src="/mzo_ui.js?v=1" defer></script>
  <script src="/mzo_data_hub.js" defer></script>
  <script src="/mzo_scope.js?v=5" defer></script>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Solar connections</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <div class="ui-seg" id="scheme" role="group" aria-label="Scheme"></div>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-filters">
      <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Application, consumer ID or name" autocomplete="off" /></label>
      <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>

    <section class="ui-stats" style="--n:4" id="stats" aria-label="Summary">
      <button type="button" class="ui-stat" data-k=""><div class="k">Applications</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="done"><div class="k"><span class="ui-dot ok"></span>Connected</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="pending"><div class="k"><span class="ui-dot warn"></span>Pending</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="issue"><div class="k"><span class="ui-dot bad"></span>Meter issue</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
    </section>

    <div class="ui-grid">
      <section class="ui-panel">
        <div class="ui-panel-h">
          <h2>By office</h2>
          <div class="ui-tabs" role="tablist" id="levelTabs">
            <button type="button" class="ui-tab" role="tab" data-l="region" aria-selected="true">Region</button>
            <button type="button" class="ui-tab" role="tab" data-l="division">Division</button>
            <button type="button" class="ui-tab" role="tab" data-l="ccc">CCC</button>
          </div>
        </div>
        <div id="officeTable" style="--max-h:520px"><div class="ui-empty">Loading…</div></div>
      </section>
      <div>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>Pending for</h2></div>
          <div class="ui-panel-b"><div id="ageHist"></div></div>
        </section>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>By scheme</h2></div>
          <div class="ui-panel-b"><div id="schemeHist"></div></div>
        </section>
      </div>
    </div>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2>Applications <small id="appCount"></small></h2>
        <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
      </div>
      <div id="appTable"><div class="ui-empty">Loading…</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var SCHEME = { PMSGMBY: 'PM Surya Ghar', WBREDA: 'WBREDA', ALOSHREE: 'Aloshree', OTHERS: 'Others' };
    var STATUS = { done: { label: 'Connected', cls: 'ok' }, pending: { label: 'Pending', cls: 'warn' }, issue: { label: 'Meter issue', cls: 'bad' } };
    var AGE = [
      { key: 'a0', label: 'Under a month', max: 30 },
      { key: 'a1', label: '1–3 months', max: 91 },
      { key: 'a2', label: '3–6 months', max: 182 },
      { key: 'a3', label: '6–12 months', max: 365 },
      { key: 'a4', label: 'Over a year', max: Infinity }
    ];
    var all = [], f = { q: '', scheme: '', status: '', age: '' }, level = 'region', scope = null;

    function status(v) {
      var s = String(v || '').trim().toUpperCase();
      if (s === 'SUCCESS' || s === 'EFFECTED' || s === 'DONE') return 'done';
      if (!s || s === '(NULL)' || s === 'NOT YET' || s === 'PENDING') return 'pending';
      return 'issue';
    }
    function scheme(v) { var s = String(v || '').trim().toUpperCase(); return !s || s === 'OTHER' || s === '(NULL)' ? 'OTHERS' : s; }

    function prepare(text) {
      var asOn = '';
      all = UI.csv(text).filter(function (d) { return d.SOLAR_APPL_NO || d.CON_ID; }).map(function (d) {
        if (!asOn && d['Report Date']) asOn = d['Report Date'];
        var o = UI.office(d['CCC CODE'], d.SUPP_OFF);
        var created = UI.date(d.CREATION_DATE);
        var st = status(d.REPLACE_STATUS);
        var r = {
          appl: String(d.SOLAR_APPL_NO || '').trim(), con: String(d.CON_ID || '').trim(),
          name: [d.FNAME, d.LNAME].filter(function (x) { return !UI.blank(x) && x !== 'NA'; }).map(UI.title).join(' '),
          phone: UI.blank(d.PHONE_NO) ? '' : d.PHONE_NO, code: String(d['CCC CODE'] || '').trim(),
          _region: o.region, _divn: o.division, _supp: o.ccc || UI.title(String(d.SUPP_OFF || '').replace(/\s*CCC.*$/i, '')), CCC_CODE: String(d['CCC CODE'] || '').trim(),
          scheme: scheme(d.REMARKS), cls: d.CLASS, load: parseFloat(d.LOAD_APPL) || 0, curr: parseFloat(d.CURR_LOAD) || 0,
          created: created, wait: st === 'done' ? null : UI.days(created), st: st,
          meterType: UI.blank(d.METER_TYPE) ? '' : d.METER_TYPE, genMeter: UI.blank(d.GEN_METER1) ? '' : d.GEN_METER1, conMeter: UI.blank(d.CON_METER) ? '' : d.CON_METER,
          wo: UI.blank(d.WON) ? '' : d.WON, woDate: d.WORK_ORDER_DATE, quoteDue: d.QUOTATION_DUE_DATE,
          response: [d.RESPONSE1, d.RESPONSE2, d.RESPONSE3].filter(function (x) { return !UI.blank(x); }).join(' · ')
        };
        r.ageKey = r.wait == null ? '' : AGE.filter(function (b) { return r.wait <= b.max; })[0].key;
        return r;
      });
      if (window.MzoScope) all = window.MzoScope.filterRows(all);
      $('meta').textContent = (asOn ? 'As on ' + UI.fmtDate(asOn) + ' · ' : '') + UI.n(all.length) + ' applications';
      var schemes = {}; all.forEach(function (r) { schemes[r.scheme] = (schemes[r.scheme] || 0) + 1; });
      $('scheme').innerHTML = '<button type="button" data-s="" aria-pressed="true">All</button>' +
        Object.keys(schemes).sort(function (a, b) { return schemes[b] - schemes[a]; }).map(function (s) { return '<button type="button" data-s="' + UI.esc(s) + '" aria-pressed="false">' + UI.esc(SCHEME[s] || UI.title(s)) + '</button>'; }).join('');
      fillFilters();
    }

    function uniq(rows, k) { var s = {}; rows.forEach(function (r) { if (r[k]) s[r[k]] = 1; }); return Object.keys(s).sort(); }
    function fillFilters() {
      var reg = $('regionFilter').value, div = $('divisionFilter').value;
      UI.fill('regionFilter', uniq(all, '_region'), 'All regions');
      var r1 = all.filter(function (r) { return !reg || r._region === reg; });
      UI.fill('divisionFilter', uniq(r1, '_divn'), 'All divisions');
      var r2 = r1.filter(function (r) { return !div || r._divn === div; });
      UI.fill('cccFilter', uniq(r2, '_supp'), 'All CCCs');
      if (!scope) scope = UI.lockScope();
    }

    function base() {
      var q = f.q.toLowerCase(), reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value;
      return all.filter(function (r) {
        return (!f.scheme || r.scheme === f.scheme) && (!reg || r._region === reg) && (!div || r._divn === div) && (!ccc || r._supp === ccc) &&
          (!q || r.appl.indexOf(q) !== -1 || r.con.indexOf(q) !== -1 || r.name.toLowerCase().indexOf(q) !== -1);
      });
    }

    function render() {
      var b = base(), count = function (rows, st) { return rows.filter(function (r) { return r.st === st; }).length; };
      var view = b.filter(function (r) { return (!f.status || r.st === f.status) && (!f.age || r.ageKey === f.age); });

      var pend = b.filter(function (r) { return r.st === 'pending' && r.wait != null; }).map(function (r) { return r.wait; }).sort(function (x, y) { return x - y; });
      var median = pend.length ? pend[Math.floor(pend.length / 2)] : null;
      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k'), c = k ? count(b, k) : b.length;
        el.querySelector('.v').textContent = UI.n(c);
        el.querySelector('.s').textContent = !k ? UI.n(Math.round(b.reduce(function (a, r) { return a + r.load; }, 0))) + ' kW applied'
          : k === 'pending' ? (median != null ? 'Median wait ' + UI.age(median) : '—')
          : UI.pct(c, b.length) + ' of applications';
        el.setAttribute('aria-pressed', String(f.status === k));
      });

      var key = level === 'region' ? '_region' : level === 'division' ? '_divn' : '_supp', groups = {};
      view.forEach(function (r) {
        var name = r[key] || 'Unmapped';
        var g = groups[name] || (groups[name] = { name: name, parent: level === 'ccc' ? r._divn : level === 'division' ? r._region : '', n: 0, done: 0, pending: 0, issue: 0 });
        g.n++; g[r.st]++;
      });
      var list = Object.keys(groups).map(function (k) { return groups[k]; });
      var tot = { n: view.length, done: count(view, 'done'), pending: count(view, 'pending'), issue: count(view, 'issue') };
      UI.table('officeTable', {
        rows: list, sort: { key: 'n', dir: 'desc' }, count: false, empty: 'No applications for these filters.',
        columns: [
          { key: 'name', label: level === 'ccc' ? 'CCC' : level === 'division' ? 'Division' : 'Region', fmt: function (v, g) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (g.parent ? '<span class="sub">' + UI.esc(g.parent) + '</span>' : ''); } },
          { key: 'n', label: 'Applications', num: true, fmt: UI.n },
          { key: 'pending', label: 'Pending', num: true, fmt: UI.n },
          { key: 'issue', label: 'Issue', num: true, fmt: UI.n, hideSm: true },
          { key: 'rate', label: 'Connected', sortVal: function (g) { return g.n ? g.done / g.n : 0; }, fmt: function (_, g) { return UI.bar(g.done, g.n, UI.pct(g.done, g.n)); }, width: '26%' }
        ],
        foot: list.length > 1 ? { n: tot.n, pending: tot.pending, issue: tot.issue, done: tot.done, rate: 0 } : null,
        onRow: level === 'ccc' ? null : function (g) { drill(g.name); }
      });

      var pendRows = b.filter(function (r) { return r.st === 'pending'; });
      UI.hist('ageHist', AGE.map(function (a) { return { key: a.key, label: a.label, value: pendRows.filter(function (r) { return r.ageKey === a.key; }).length }; }),
        { active: f.age, onClick: function (row) { f.age = f.age === row.key ? '' : row.key; if (f.age) f.status = 'pending'; render(); } });
      var sc = {};
      b.forEach(function (r) { sc[r.scheme] = (sc[r.scheme] || 0) + 1; });
      UI.hist('schemeHist', Object.keys(sc).sort(function (x, y) { return sc[y] - sc[x]; }).map(function (s) { return { key: s, label: SCHEME[s] || UI.title(s), value: sc[s] }; }),
        { active: f.scheme, onClick: function (row) { setScheme(f.scheme === row.key ? '' : row.key); } });

      $('appCount').textContent = UI.n(view.length);
      UI.table('appTable', { rows: view, sort: { key: 'wait', dir: 'desc' }, limit: 50, resetPage: true, empty: 'No applications match these filters.', columns: APP_COLS, onRow: detail });
      $('clearBtn').hidden = !(f.q || f.scheme || f.status || f.age || ($('regionFilter').value && !$('regionFilter').disabled) || ($('divisionFilter').value && !$('divisionFilter').disabled) || ($('cccFilter').value && !$('cccFilter').disabled));
      window.__view = view;
    }

    var APP_COLS = [
      { key: 'appl', label: 'Application', fmt: function (v, r) { return '<span class="ui-strong">' + UI.esc(v || '—') + '</span><span class="sub">' + UI.esc(r.con) + '</span>'; } },
      { key: 'name', label: 'Name', hideSm: true, cls: 'wrap' },
      { key: '_supp', label: 'CCC', fmt: function (v, r) { return UI.esc(v || r.code) + '<span class="sub">' + UI.esc(r._divn) + '</span>'; } },
      { key: 'scheme', label: 'Scheme', hideSm: true, fmt: function (v) { return UI.esc(SCHEME[v] || UI.title(v)); } },
      { key: 'load', label: 'Load (kW)', num: true, fmt: function (v) { return v ? UI.n(v) : '—'; } },
      { key: 'created', label: 'Applied', num: true, hideSm: true, sortVal: function (r) { return r.created ? r.created.getTime() : 0; }, fmt: function (v) { return UI.fmtDate(v); }, csv: function (r) { return UI.fmtDate(r.created); } },
      { key: 'wait', label: 'Pending for', num: true, sortVal: function (r) { return r.wait == null ? -1 : r.wait; }, fmt: function (v) { return v == null ? '<span class="ui-muted">—</span>' : UI.age(v); }, csv: function (r) { return r.wait == null ? '' : r.wait + ' days'; } },
      { key: 'st', label: 'Status', fmt: function (v) { return '<span class="ui-badge ' + STATUS[v].cls + '">' + STATUS[v].label + '</span>'; }, csv: function (r) { return STATUS[r.st].label; } }
    ];

    function detail(r) {
      UI.drawer('Application ' + (r.appl || '—'), [STATUS[r.st].label, r._supp, r._divn].filter(Boolean).join(' · '), [
        ['Consumer ID', r.con], ['Name', r.name], ['Phone', r.phone], ['Scheme', SCHEME[r.scheme] || r.scheme], ['Class', r.cls],
        ['Applied load', r.load ? r.load + ' kW' : ''], ['Current load', r.curr ? r.curr + ' kW' : ''], ['Applied on', UI.fmtDate(r.created)],
        ['Pending for', r.wait == null ? '' : UI.age(r.wait)], ['Quotation due', r.quoteDue ? UI.fmtDate(r.quoteDue) : ''],
        ['Work order', r.wo], ['Work order date', r.woDate && !UI.blank(r.woDate) ? UI.fmtDate(r.woDate) : ''],
        ['Meter type', r.meterType], ['Generation meter', r.genMeter], ['Consumption meter', r.conMeter], ['Replacement notes', r.response], ['CCC code', r.code]
      ]);
    }

    function setScheme(s) {
      f.scheme = s;
      [].forEach.call(document.querySelectorAll('#scheme button'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-s') === s)); });
      render();
    }
    function setLevel(l) {
      level = l;
      [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === l)); });
      render();
    }
    function drill(name) {
      if (level === 'region') { $('regionFilter').value = name; $('divisionFilter').value = ''; level = 'division'; }
      else { $('divisionFilter').value = name; level = 'ccc'; }
      $('cccFilter').value = '';
      fillFilters(); ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { UI.mark($(id)); });
      setLevel(level);
    }

    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') $('divisionFilter').value = '';
        if (id !== 'cccFilter') $('cccFilter').value = '';
        fillFilters(); ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (x) { UI.mark($(x)); });
        render();
      });
    });
    $('q').addEventListener('input', UI.debounce(function () { f.q = this.value.trim(); render(); }, 160));
    $('scheme').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) setScheme(b.getAttribute('data-s')); });
    $('stats').addEventListener('click', function (e) { var s = e.target.closest('.ui-stat'); if (!s) return; var k = s.getAttribute('data-k'); f.status = f.status === k ? '' : k; if (f.status !== 'pending') f.age = ''; render(); });
    $('levelTabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) setLevel(t.getAttribute('data-l')); });
    $('clearBtn').addEventListener('click', function () {
      f.q = ''; f.status = ''; f.age = ''; $('q').value = '';
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { if (!$(id).disabled) $(id).value = ''; });
      fillFilters(); ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (x) { UI.mark($(x)); });
      setScheme('');
    });
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('solar-connections.csv', [{ key: 'appl', label: 'Application' }, { key: 'con', label: 'Consumer ID' }, { key: 'name', label: 'Name' }, { key: '_region', label: 'Region' }, { key: '_divn', label: 'Division' }, { key: '_supp', label: 'CCC' }, { key: 'scheme', label: 'Scheme' }, { key: 'load', label: 'Load (kW)' }].concat(APP_COLS.slice(5)), window.__view || []);
    });
    $('refreshBtn').addEventListener('click', function () {
      var b = this; b.classList.add('spin');
      Promise.resolve(window.mzoDataHub.waitForDataset('CACHE_SOLAR', { forceCheck: true })).catch(function () {})
        .then(function () { return window.mzoDataHub._peek('CACHE_SOLAR'); }).then(function (t) { if (t) { prepare(t); render(); } })
        .then(function () { b.classList.remove('spin'); });
    });

    var first = true;
    UI.load('CACHE_SOLAR', function (text, info) {
      if (!text) { if (info && info.error) { $('meta').textContent = 'Could not load data'; $('appTable').innerHTML = $('officeTable').innerHTML = '<div class="ui-empty">Could not load data.</div>'; } return; }
      prepare(text);
      if (first) {
        first = false;
        if (scope && (scope.level === 'division' || scope.level === 'ccc')) level = 'ccc'; else if (scope && scope.level === 'region') level = 'division';
        // Deep links: ?region= ?division= ?ccc= ?q= ?status=done|pending|issue ?scheme=PMSGMBY|WBREDA|ALOSHREE|OTHERS
        var params = new URLSearchParams(location.search);
        var pick = function (id, v) {
          var el = $(id); if (!v || el.disabled) return false;
          var m = [].filter.call(el.options, function (o) { return o.value && o.value.toLowerCase() === v.toLowerCase(); })[0];
          if (m) { el.value = m.value; fillFilters(); UI.mark(el); return true; } return false;
        };
        if (pick('regionFilter', params.get('region'))) level = 'division';
        if (pick('divisionFilter', params.get('division'))) level = 'ccc';
        if (pick('cccFilter', params.get('ccc'))) level = 'ccc';
        if (params.get('q')) { f.q = params.get('q').trim(); $('q').value = f.q; }
        if (STATUS[params.get('status')]) f.status = params.get('status');
        var sch = String(params.get('scheme') || '').toUpperCase();
        if (sch && all.some(function (r) { return r.scheme === sch; })) { f.scheme = sch; [].forEach.call(document.querySelectorAll('#scheme button'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-s') === sch)); }); }
        [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === level)); });
      }
      render();
    });
  });
  </script>
</body>
</html>
