<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Withheld NSC · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=3" />
  <script src="/mzo_ui.js?v=1" defer></script>
  <script src="/mzo_data_hub.js" defer></script>
  <script src="/mzo_scope.js?v=5" defer></script>
  <style>
    /* Long reason names: label and count on one line, bar below */
    #reasonHist .row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "l v" "b b"; height: auto; row-gap: 6px; padding: 6px 4px; }
    #reasonHist .row > span:first-child { grid-area: l; white-space: normal; }
    #reasonHist .row > i { grid-area: b; }
    #reasonHist .row > span:last-child { grid-area: v; }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Withheld NSC</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <div class="ui-seg" id="source" role="group" aria-label="Source">
          <button type="button" data-s="" aria-pressed="true">All</button>
          <button type="button" data-s="Y" aria-pressed="false">Portal</button>
          <button type="button" data-s="N" aria-pressed="false">Offline</button>
        </div>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-filters">
      <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Application, name or phone" autocomplete="off" /></label>
      <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
      <span class="ui-select"><select id="classFilter" aria-label="Class"><option value="">All classes</option></select></span>
      <span class="ui-select"><select id="reasonFilter" aria-label="Reason"><option value="">All reasons</option></select></span>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>

    <section class="ui-stats" style="--n:5" id="stats" aria-label="Summary">
      <button type="button" class="ui-stat" data-k=""><div class="k">Withheld</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="d7"><div class="k">Last 7 days</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="d30"><div class="k">Last 30 days</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="d90"><div class="k">Last 90 days</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="invalid"><div class="k"><span class="ui-dot bad"></span>No valid reason</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
    </section>

    <div class="ui-grid">
      <section class="ui-panel">
        <div class="ui-panel-h">
          <h2>Breakdown</h2>
          <div class="ui-tabs" role="tablist" id="levelTabs">
            <button type="button" class="ui-tab" role="tab" data-l="region" aria-selected="true">Region</button>
            <button type="button" class="ui-tab" role="tab" data-l="division">Division</button>
            <button type="button" class="ui-tab" role="tab" data-l="ccc">CCC</button>
            <button type="button" class="ui-tab" role="tab" data-l="cls">Class</button>
          </div>
        </div>
        <div id="officeTable" style="--max-h:520px"><div class="ui-empty">Loading…</div></div>
      </section>
      <div>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>By reason</h2><span class="ui-note">Every withheld application needs a valid reason</span></div>
          <div class="ui-panel-b"><div id="reasonHist"></div></div>
        </section>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>Withheld by year</h2></div>
          <div class="ui-panel-b"><div id="yearHist"></div></div>
        </section>
      </div>
    </div>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2>Applications <small id="appCount"></small></h2>
        <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
      </div>
      <div id="appTable"><div class="ui-empty">Loading…</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var KEY = 'CACHE_WITHHELD_v4';
    var CLASS = { D: 'Domestic', C: 'Commercial', A: 'Agriculture', I: 'Industrial', S: 'Street light', J: 'Public', P: 'Public', W: 'Water works', T: 'Temporary' };
    var INVALID = ['', 'Not Specified', 'LT Infrastructure required', 'Earthing Not Completed', 'WBSEDCL is unable to provide connection', 'n', 'N', 'NO', 'Y',
      'Dependent on other application', 'Particulars of capacitor bank(if installed) not Found', 'Meter and Main Switch should be separated', 'YES', 'y', 'no',
      'Location of installation of Transformer need to be identified clearly', 'yes'];
    var NO_REASON = 'No valid reason';
    var all = [], asOn = null, f = { q: '', src: '', stat: '', year: '' }, level = 'region', scope = null;

    function prepare(text) {
      var rows = Array.isArray(text) ? text : UI.csv(text), today = null, seen = {};
      all = [];
      rows.forEach(function (d) {
        var appl = String(d.APPL_NO || '').trim();
        if (!appl) return;
        var t = UI.date(d.TODAY); if (t && (!today || t > today)) today = t;
        var reason = String(d.SCN_WITHELD_REASON || '').trim();
        var invalid = INVALID.indexOf(reason) !== -1;
        var r = {
          appl: appl, name: UI.blank(d.NAME) ? '' : UI.title(d.NAME), phone: UI.blank(d.PHONE_NO) ? '' : d.PHONE_NO,
          _region: UI.regionName(d.REGION), _divn: UI.title(d.DIVN_NAME), _supp: UI.title(d.SUPP_OFF), CCC_CODE: String(d.CCC_CODE || '').trim(),
          cls: String(d.CONN_CLASS || '').trim().toUpperCase(), phase: String(d.APPLIED_PHASE || '').trim().toUpperCase(),
          paid: UI.date(d.COLL_DATE), withheld: UI.date(d.SCN_WITHELD_DATE),
          reason: reason || 'Not specified', invalid: invalid, group: invalid ? NO_REASON : reason,
          portal: d.IS_PORTAL_APPL === 'Y' ? 'Y' : 'N'
        };
        r.label = CLASS[r.cls] || r.cls || '—';
        r.year = r.withheld ? String(r.withheld.getFullYear()) : '';
        // Count each application once; the last row wins.
        if (seen[appl] != null) all[seen[appl]] = r; else { seen[appl] = all.length; all.push(r); }
      });
      if (window.MzoScope) all = window.MzoScope.filterRows(all);
      if (today && (!asOn || today > asOn)) asOn = today;
      all.forEach(function (r) { r.ago = r.withheld && asOn ? Math.floor((asOn - r.withheld) / 864e5) : null; });
      paintMeta();
      fillFilters();
    }
    function paintMeta() { $('meta').textContent = (asOn ? 'As on ' + UI.fmtDate(asOn) + ' · ' : '') + UI.n(all.length) + ' applications'; }

    var STAT = {
      d7: function (r) { return r.ago != null && r.ago >= 0 && r.ago <= 7; },
      d30: function (r) { return r.ago != null && r.ago >= 0 && r.ago <= 30; },
      d90: function (r) { return r.ago != null && r.ago >= 0 && r.ago <= 90; },
      invalid: function (r) { return r.invalid; }
    };

    function uniq(rows, k) { var s = {}; rows.forEach(function (r) { if (r[k]) s[r[k]] = 1; }); return Object.keys(s).sort(); }
    function fillFilters() {
      var reg = $('regionFilter').value, div = $('divisionFilter').value;
      UI.fill('regionFilter', uniq(all, '_region'), 'All regions');
      var r1 = all.filter(function (r) { return !reg || r._region === reg; });
      UI.fill('divisionFilter', uniq(r1, '_divn'), 'All divisions');
      var r2 = r1.filter(function (r) { return !div || r._divn === div; });
      UI.fill('cccFilter', uniq(r2, '_supp'), 'All CCCs');
      var cls = {}; all.forEach(function (r) { if (r.cls) cls[r.cls] = r.label; });
      UI.fill('classFilter', Object.keys(cls).sort().map(function (c) { return { value: c, label: cls[c] === c ? c : cls[c] + ' (' + c + ')' }; }), 'All classes');
      var reasons = uniq(all.filter(function (r) { return !r.invalid; }), 'group');
      UI.fill('reasonFilter', [{ value: NO_REASON, label: NO_REASON }].concat(reasons), 'All reasons');
      if (!scope) scope = UI.lockScope();
    }

    function base() {
      var q = f.q.toLowerCase(), reg = $('regionFilter').value, div = $('divisionFilter').value, cc = $('cccFilter').value, cl = $('classFilter').value, rs = $('reasonFilter').value;
      return all.filter(function (r) {
        return (!f.src || r.portal === f.src) && (!reg || r._region === reg) && (!div || r._divn === div) && (!cc || r._supp === cc) &&
          (!cl || r.cls === cl) && (!rs || r.group === rs) &&
          (!q || r.appl.indexOf(q) !== -1 || r.name.toLowerCase().indexOf(q) !== -1 || r.phone.indexOf(q) !== -1);
      });
    }

    function render() {
      var b = base();
      var view = b.filter(function (r) { return (!f.stat || STAT[f.stat](r)) && (!f.year || (f.year.indexOf('<=') === 0 ? (r.year && r.year <= f.year.slice(2)) : r.year === f.year)); });

      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k'), c = k ? b.filter(STAT[k]).length : b.length;
        el.querySelector('.v').textContent = UI.n(c);
        el.querySelector('.s').textContent = k ? UI.pct(c, b.length) + ' of withheld' : UI.pct(b.filter(function (r) { return r.portal === 'Y'; }).length, b.length) + ' from the portal';
        el.setAttribute('aria-pressed', String(f.stat === k));
      });

      var key = { region: '_region', division: '_divn', ccc: '_supp', cls: 'label' }[level], groups = {};
      view.forEach(function (r) {
        var name = r[key] || 'Unmapped';
        var g = groups[name] || (groups[name] = { name: name, parent: level === 'ccc' ? r._divn : level === 'division' ? r._region : '', n: 0, d30: 0, portal: 0, invalid: 0 });
        g.n++; if (STAT.d30(r)) g.d30++; if (r.portal === 'Y') g.portal++; if (r.invalid) g.invalid++;
      });
      var list = Object.keys(groups).map(function (k) { return groups[k]; }), max = Math.max.apply(null, list.map(function (g) { return g.n; }).concat([0]));
      UI.table('officeTable', {
        rows: list, sort: { key: 'n', dir: 'desc' }, count: level === 'ccc' || level === 'cls',
        empty: 'Nothing withheld for these filters.',
        columns: [
          { key: 'name', label: { region: 'Region', division: 'Division', ccc: 'CCC', cls: 'Class' }[level], fmt: function (v, g) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (g.parent ? '<span class="sub">' + UI.esc(g.parent) + '</span>' : ''); } },
          { key: 'n', label: 'Withheld', num: true, fmt: UI.n },
          { key: 'd30', label: 'Last 30 days', num: true, fmt: UI.n },
          { key: 'invalid', label: 'No valid reason', num: true, fmt: UI.n, hideSm: true },
          { key: 'portal', label: 'Portal', num: true, hideSm: true, sortVal: function (g) { return g.n ? g.portal / g.n : 0; }, fmt: function (v, g) { return UI.pct(v, g.n); } },
          { key: 'share', label: 'Share', sortVal: function (g) { return g.n; }, fmt: function (_, g) { return UI.bar(g.n, max, UI.pct(g.n, view.length)); }, hideSm: true, width: '24%' }
        ],
        foot: list.length > 1 ? { n: view.length, d30: view.filter(STAT.d30).length, invalid: view.filter(STAT.invalid).length, portal: view.filter(function (r) { return r.portal === 'Y'; }).length } : null,
        onRow: level === 'region' || level === 'division' ? function (g) { drill(g.name); } : null
      });

      var rs = {}; view.forEach(function (r) { rs[r.group] = (rs[r.group] || 0) + 1; });
      UI.hist('reasonHist', Object.keys(rs).sort(function (a, c) { return rs[c] - rs[a]; }).slice(0, 8).map(function (k) { return { key: k, label: k, value: rs[k] }; }),
        { active: $('reasonFilter').value, onClick: function (row) { var s = $('reasonFilter'); s.value = s.value === row.key ? '' : row.key; UI.mark(s); render(); } });
      var yr = {}; b.filter(function (r) { return !f.stat || STAT[f.stat](r); }).forEach(function (r) { if (r.year) yr[r.year] = (yr[r.year] || 0) + 1; });
      var years = Object.keys(yr).sort().reverse(), rowsY = years.slice(0, 9).map(function (y) { return { key: y, label: y, value: yr[y] }; });
      if (years.length > 9) {
        var cut = years[9];
        rowsY.push({ key: '<=' + cut, label: cut + ' and earlier', value: years.slice(9).reduce(function (a, y) { return a + yr[y]; }, 0) });
      }
      UI.hist('yearHist', rowsY, { active: f.year, onClick: function (row) { f.year = f.year === row.key ? '' : row.key; render(); } });

      $('appCount').textContent = UI.n(view.length);
      UI.table('appTable', { rows: view, sort: { key: 'withheld', dir: 'desc' }, limit: 50, resetPage: true, empty: 'No applications match these filters.', columns: APP_COLS, onRow: detail });
      $('clearBtn').hidden = !(f.q || f.src || f.stat || f.year || $('classFilter').value || $('reasonFilter').value || ['regionFilter', 'divisionFilter', 'cccFilter'].some(function (id) { return $(id).value && !$(id).disabled; }));
      window.__view = view;
    }

    var APP_COLS = [
      { key: 'appl', label: 'Application', fmt: function (v, r) { return '<span class="ui-strong">' + UI.esc(v) + '</span><span class="sub">' + (r.portal === 'Y' ? 'Portal' : 'Offline') + '</span>'; } },
      { key: 'name', label: 'Name', cls: 'wrap', hideSm: true },
      { key: 'phone', label: 'Phone', hideSm: true },
      { key: '_supp', label: 'CCC', fmt: function (v, r) { return UI.esc(v || '—') + '<span class="sub">' + UI.esc(r._divn) + '</span>'; } },
      { key: 'label', label: 'Class', hideSm: true, fmt: function (v, r) { return UI.esc(v) + '<span class="sub">' + (r.phase === 'III' ? 'Three phase' : 'Single phase') + '</span>'; } },
      { key: 'withheld', label: 'Withheld on', num: true, sortVal: function (r) { return r.withheld ? r.withheld.getTime() : 0; }, fmt: function (v) { return UI.fmtDate(v); }, csv: function (r) { return UI.fmtDate(r.withheld); } },
      { key: 'reason', label: 'Reason', cls: 'wrap', fmt: function (v, r) { return r.invalid ? '<span class="ui-badge bad">' + UI.esc(v) + '</span>' : UI.esc(v); } }
    ];

    function detail(r) {
      UI.drawer('Application ' + r.appl, [r._supp, r._divn, r._region].filter(Boolean).join(' · '), [
        ['Name', r.name], ['Phone', r.phone], ['Class', r.label + (r.cls && r.label !== r.cls ? ' (' + r.cls + ')' : '')], ['Phase', r.phase === 'III' ? 'Three phase' : 'Single phase'],
        ['Source', r.portal === 'Y' ? 'Portal' : 'Offline'], ['Paid on', r.paid ? UI.fmtDate(r.paid) : ''], ['Withheld on', r.withheld ? UI.fmtDate(r.withheld) : ''],
        ['Withheld for', r.ago != null ? UI.age(r.ago) : ''], ['Reason', r.reason + (r.invalid ? ' (not a valid reason)' : '')], ['CCC code', r.CCC_CODE]
      ]);
    }

    function setLevel(l) {
      level = l;
      [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === l)); });
      render();
    }
    function drill(name) {
      if (level === 'region') { $('regionFilter').value = name; $('divisionFilter').value = ''; level = 'division'; }
      else { $('divisionFilter').value = name; level = 'ccc'; }
      $('cccFilter').value = '';
      offices(); setLevel(level);
    }
    function offices() { fillFilters(); ['regionFilter', 'divisionFilter', 'cccFilter', 'classFilter', 'reasonFilter'].forEach(function (x) { UI.mark($(x)); }); }

    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') $('divisionFilter').value = '';
        if (id !== 'cccFilter') $('cccFilter').value = '';
        offices(); render();
      });
    });
    ['classFilter', 'reasonFilter'].forEach(function (id) { $(id).addEventListener('change', function () { UI.mark(this); render(); }); });
    $('q').addEventListener('input', UI.debounce(function () { f.q = this.value.trim().toLowerCase(); render(); }, 180));
    $('source').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      f.src = b.getAttribute('data-s');
      [].forEach.call(this.querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      render();
    });
    $('stats').addEventListener('click', function (e) { var s = e.target.closest('.ui-stat'); if (!s) return; var k = s.getAttribute('data-k'); f.stat = f.stat === k ? '' : k; render(); });
    $('levelTabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) setLevel(t.getAttribute('data-l')); });
    $('clearBtn').addEventListener('click', function () {
      f.q = ''; f.stat = ''; f.year = ''; f.src = ''; $('q').value = ''; $('classFilter').value = ''; $('reasonFilter').value = '';
      [].forEach.call(document.querySelectorAll('#source button'), function (x) { x.setAttribute('aria-pressed', String(x.getAttribute('data-s') === '')); });
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { if (!$(id).disabled) $(id).value = ''; });
      offices(); render();
    });
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('withheld-nsc.csv', [
        { key: 'appl', label: 'Application' }, { key: 'name', label: 'Name' }, { key: 'phone', label: 'Phone' },
        { key: '_region', label: 'Region' }, { key: '_divn', label: 'Division' }, { key: '_supp', label: 'CCC' }, { key: 'cls', label: 'Class' }, { key: 'phase', label: 'Phase' },
        { key: 'paid', label: 'Paid on', csv: function (r) { return r.paid ? UI.fmtDate(r.paid) : ''; } }].concat(APP_COLS.slice(5))
        .concat([{ key: 'portal', label: 'Source', csv: function (r) { return r.portal === 'Y' ? 'Portal' : 'Offline'; } }]), window.__view || []);
    });

    function reload(text) { if (text) { prepare(text); render(); } }
    $('refreshBtn').addEventListener('click', function () {
      var b = this; b.classList.add('spin');
      Promise.resolve(window.mzoDataHub.waitForDataset(KEY, { forceCheck: true })).catch(function () {})
        .then(function () { return window.mzoDataHub._peek(KEY); }).then(reload)
        .then(function () { b.classList.remove('spin'); });
    });

    // A fresh NSC upload (nsc/upload.html) asks this page to reload its dump.
    try {
      new BroadcastChannel('mzo-withheld').onmessage = function (ev) {
        if (ev && ev.data && ev.data.type === 'withheld-uploaded') { try { localStorage.setItem('mzo_withheld_pending_refresh', '1'); } catch (e) {} location.reload(); }
      };
    } catch (e) {}

    // "As on": the later of the dump's TODAY and the NSC upload report date.
    fetch('/api/nsc/meta?ts=' + Date.now(), { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      var m = (j && j.meta) || {}, d = UI.date(m.reportDate) || UI.date((m.stats || {}).today);
      if (d && (!asOn || d > asOn)) {
        asOn = d;
        if (all.length) { all.forEach(function (r) { r.ago = r.withheld ? Math.floor((asOn - r.withheld) / 864e5) : null; }); paintMeta(); render(); }
      }
    }).catch(function () {});

    var pending = false;
    try { pending = localStorage.getItem('mzo_withheld_pending_refresh') === '1'; } catch (e) {}
    var start = pending
      ? Promise.resolve(window.mzoDataHub.refresh(KEY)).catch(function () {}).then(function () { try { localStorage.removeItem('mzo_withheld_pending_refresh'); } catch (e) {} })
      : Promise.resolve();
    start.then(function () {
      UI.load(KEY, function (text, info) {
        if (!text) { if (info && info.error) { $('meta').textContent = 'Could not load data'; $('appTable').innerHTML = $('officeTable').innerHTML = '<div class="ui-empty">Could not load data.</div>'; } return; }
        var firstPaint = !all.length;
        prepare(text);
        if (firstPaint) {
          if (scope && (scope.level === 'division' || scope.level === 'ccc')) level = 'ccc'; else if (scope && scope.level === 'region') level = 'division';
          [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === level)); });
        }
        render();
      });
    });
  });
  </script>
</body>
</html>
